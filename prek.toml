default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"
hooks = [
  { id = "format-check", name = "format-check", entry = "mise run format-check", language = "system", pass_filenames = false },
  { id = "lint", name = "lint", entry = "mise run lint", language = "system", pass_filenames = false },
  { id = "typecheck", name = "typecheck", entry = "mise run typecheck", language = "system", pass_filenames = false },
  { id = "secret-scan", name = "secret-scan", entry = "mise run secret-scan", language = "system", pass_filenames = false },
  { id = "commit-msg", name = "commit-msg", entry = "cog verify --ignore-merge-commits --file", language = "system", stages = [
    "commit-msg",
  ] },
]
