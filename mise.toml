[tools]
node = "26"
pnpm = "12"
prek = "0.5"
cocogitto = "7"
gitleaks = "8"

[tasks.format]
run = "pnpm format"

[tasks.format-check]
run = "pnpm format:check"

[tasks.lint]
run = "pnpm lint"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.secret-scan]
run = "gitleaks dir . --redact"

[tasks.check]
depends = ["format-check", "lint", "typecheck", "secret-scan"]

[tasks.build-web]
run = "pnpm --filter @ai-moves/web build"

[tasks.build]
depends = ["build-web"]
run = "pnpm --filter @ai-moves/api build"
