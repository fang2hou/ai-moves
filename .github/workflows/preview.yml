name: Desk PR Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: desk-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview the Desk
    # Same-repository pull requests only, and only where the Cloudflare preview Worker lives.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'fang2hou/ai-moves'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Check for preview credentials
        id: credentials
        env:
          PREVIEW_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN != '' }}
          ACCOUNT_ID_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ "$PREVIEW_TOKEN_CONFIGURED" != true ]]; then
            echo 'Desk preview skipped because CLOUDFLARE_PREVIEW_API_TOKEN is not configured in the preview environment.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ACCOUNT_ID_CONFIGURED" != true ]]; then
            echo 'Desk preview skipped because CLOUDFLARE_ACCOUNT_ID is not configured in the preview environment.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install toolchain from mise.toml
        if: steps.credentials.outputs.available == 'true'
        uses: jdx/mise-action@v5

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the desk assets
        if: steps.credentials.outputs.available == 'true'
        env:
          VITE_LOCALE: ${{ vars.DESK_LOCALE || 'zh-CN' }}
        run: mise run build-web

      - name: Upload the dev Desk version
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/desk-preview.ndjson
        run: node_modules/.bin/wrangler versions upload --config apps/api/wrangler.jsonc --env dev --preview-alias "pr-${PR_NUMBER}"

      - name: Publish the preview URL in the job summary
        if: steps.credentials.outputs.available == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/desk-preview.ndjson
        run: |
          url=$(jq -er 'select(.type == "version-upload") | .preview_alias_url // error("Version URLs must be enabled on ai-moves-desk-dev")' "$WRANGLER_OUTPUT_FILE_PATH")
          printf '### Desk PR preview\n\n[Open the Desk preview](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
