name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and static analysis
        run: mise run check

      - name: Build the desk assets
        run: pnpm --filter @ai-moves/web build

      - name: Build the API Worker bundle
        run: pnpm --filter @ai-moves/api build
