name: Deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    env:
      TARGET: ${{ github.event_name == 'release' && 'prod' || inputs.environment || 'dev' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and static analysis
        run: mise run check

      - name: Build the desk assets
        run: pnpm --filter @ai-moves/web build

      # Wrangler is a dev dependency because nothing else here can deploy a Worker,
      # and the wrangler action this workflow used installs its own copy with
      # `pnpm add`, which pnpm refuses in a workspace root. The steps run the
      # installed binary directly: `pnpm exec` may run an install first and print it
      # on stdout, which one step below reads as JSON. A dry run bundles a Worker
      # locally and contacts nothing, so one that does not build fails before
      # anything touches the database.
      - name: Bundle the pipeline
        run: node_modules/.bin/wrangler deploy --dry-run --config apps/pipeline/wrangler.jsonc --env "$TARGET"

      - name: Bundle the desk
        run: node_modules/.bin/wrangler deploy --dry-run --config apps/api/wrangler.jsonc --env "$TARGET"

      # The Worker applies the storage migrations itself against a local database.
      # A remote one is brought up to date by its ledger of recorded migrations: the
      # ledger is created where it is missing, so that reading it cannot fail on a
      # database without one, and only the migrations it does not record are applied.
      - name: Read the applied storage migrations
        run: |
          node_modules/.bin/wrangler d1 execute "$DATABASE" --remote --yes --command "CREATE TABLE IF NOT EXISTS storage_migrations (id TEXT PRIMARY KEY, applied_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP)"
          node_modules/.bin/wrangler d1 execute "$DATABASE" --remote --yes --json --command "SELECT id FROM storage_migrations" > applied.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ env.TARGET == 'prod' && 'ai-moves' || 'ai-moves-dev' }}

      - name: Render the pending storage migrations
        run: node tools/local/schema-sql.ts --applied applied.json > schema.sql

      # Each pending migration ends with its own record, so one in the file means
      # there is something to apply.
      - name: Apply the storage migrations
        run: |
          if grep -q "^INSERT OR IGNORE INTO storage_migrations" schema.sql; then
            node_modules/.bin/wrangler d1 execute "$DATABASE" --remote --yes --file=schema.sql
          else
            echo "Every storage migration is already recorded."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE: ${{ env.TARGET == 'prod' && 'ai-moves' || 'ai-moves-dev' }}

      - name: Deploy the pipeline
        run: node_modules/.bin/wrangler deploy --config apps/pipeline/wrangler.jsonc --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the desk
        run: node_modules/.bin/wrangler deploy --config apps/api/wrangler.jsonc --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
